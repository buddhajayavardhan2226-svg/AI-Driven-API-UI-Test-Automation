name: Playwright Test Automation Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      CI: "true"
      PYTHONPATH: "."
      N8N_WEBHOOK_URL: "https://jayava.app.n8n.cloud/webhook/playwright-failure"

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-playwright allure-pytest colorama faker requests pytest-rerunfailures
          npm install -g allure-commandline --save-dev

      - name: Install Playwright Browsers and Dependencies
        run: |
          python -m playwright install --with-deps

      - name: Create Artifact Directories
        run: |
          mkdir -p reports/videos reports/screenshots reports/traces allure-results allure-report

      - name: Execute Playwright Tests with Pytest
        id: run_tests
        run: |
          python -m pytest --alluredir=allure-results | tee pytest_output.log
        continue-on-error: true

      - name: Generate Allure HTML Report
        if: always()
        run: |
          allure generate allure-results --clean -o allure-report

      - name: Upload Test Results & Allure Report Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-allure-results
          path: |
            reports/
            allure-results/
            allure-report/
          retention-days: 7

      - name: Trigger n8n Webhook on Failure
        if: always()
        run: |
          # 1. Grab terminal output snippet if available
          if [ -f pytest_output.log ]; then
            TEST_LOG=$(tail -n 100 pytest_output.log)
          else
            TEST_LOG="No log captured."
          fi

          # 2. Build complete failure text
          PROMPT_TEXT="--- COMPLETE TEST SUITE FAILURE REPORT ---
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Run ID: ${{ github.run_id }}
          Status: ${{ steps.run_tests.outcome }}

          --- TERMINAL OUTPUT ---
          $TEST_LOG"

          # 3. Format as valid JSON containing 'chatInput' key
          JSON_PAYLOAD=$(jq -n --arg chatInput "$PROMPT_TEXT" '{chatInput: $chatInput}')

          # 4. POST to n8n webhook
          curl -X POST "$N8N_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD"