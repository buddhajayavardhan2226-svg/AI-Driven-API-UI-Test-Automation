name: Playwright Test Automation Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      CI: "true"
      PYTHONPATH: "."
      N8N_WEBHOOK_URL: "https://jayava.app.n8n.cloud/webhook/playwright-failure"

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-playwright allure-pytest colorama faker requests pytest-rerunfailures
          npm install -g allure-commandline --save-dev

      - name: Install Playwright Browsers and Dependencies
        run: |
          python -m playwright install --with-deps

      - name: Create Artifact Directories
        run: |
          mkdir -p reports/videos reports/screenshots reports/traces allure-results allure-report

      - name: Execute Playwright Tests with Pytest
        id: run_tests
        run: |
          # conftest.py pytest_sessionfinish hook will send the exact PyCharm payload directly to N8N_WEBHOOK_URL
          python -m pytest -s -v --alluredir=allure-results 2>&1 | tee pytest_output.log
        continue-on-error: true

      - name: Generate Allure HTML Report
        if: always()
        run: |
          allure generate allure-results --clean -o allure-report

      - name: Upload Test Results & Allure Report Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-allure-results
          path: |
            reports/
            allure-results/
            allure-report/
          retention-days: 7

      - name: Fallback Webhook Dispatch (If Pytest Process Crashed)
        if: steps.run_tests.outcome == 'failure'
        run: |
          # This step only triggers if pytest crashed before conftest sessionfinish could send the webhook
          if [ -f pytest_output.log ]; then
            TEST_LOG=$(cat pytest_output.log)
          else
            TEST_LOG="No log captured."
          fi

          PROMPT_TEXT="--- COMPLETE TEST SUITE FAILURE REPORT ---
          Total Failed Tests: 1
          --- FAILED TEST #1 ---
          Test Name: GitHub Actions Execution Error
          File Path: .github/workflows/main.yml
          Failure Stage: call
          --- STACKTRACE START ---
          $TEST_LOG
          --- STACKTRACE END ---"

          JSON_PAYLOAD=$(jq -n \
            --arg chatInput "$PROMPT_TEXT" \
            --argjson total_failures_count 1 \
            '{total_failures_count: $total_failures_count, chatInput: $chatInput, raw_failures: []}')

          curl -X POST "$N8N_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD"