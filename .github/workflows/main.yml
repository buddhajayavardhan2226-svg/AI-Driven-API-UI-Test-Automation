name: Playwright Test Automation Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      CI: "true"
      PYTHONPATH: "."
      N8N_WEBHOOK_URL: "https://jayava.app.n8n.cloud/webhook/playwright-failure"

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-playwright allure-pytest colorama faker requests pytest-rerunfailures
          npm install -g allure-commandline --save-dev

      - name: Install Playwright Browsers and Dependencies
        run: |
          python -m playwright install --with-deps

      - name: Create Artifact Directories
        run: |
          mkdir -p reports/videos reports/screenshots reports/traces allure-results allure-report

      - name: Execute Playwright Tests with Pytest
        id: run_tests
        run: |
          python -m pytest --alluredir=allure-results
        continue-on-error: true

      - name: Generate Allure HTML Report
        if: always()
        run: |
          allure generate allure-results --clean -o allure-report

      - name: Upload Test Results & Allure Report Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-allure-results
          path: |
            reports/
            allure-results/
            allure-report/
          retention-days: 7

      - name: Trigger n8n Webhook on Failure
        if: always() # Or use if: failure() to send ONLY when tests fail
        run: |
          curl -X POST "$N8N_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "status": "${{ steps.run_tests.outcome }}",
              "repository": "${{ github.repository }}",
              "branch": "${{ github.ref_name }}",
              "run_id": "${{ github.run_id }}",
              "actor": "${{ github.actor }}"
            }'