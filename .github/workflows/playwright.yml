name: Playwright Test Automation Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      CI: "true"
      PYTHONPATH: "."

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-playwright allure-pytest colorama faker

      - name: Install Playwright Browsers and Dependencies
        run: |
          python -m playwright install --with-deps

      - name: Create Artifact Directories
        run: |
          mkdir -p reports/videos reports/screenshots reports/traces allure-results

      - name: Execute Playwright Tests with Pytest
        run: |
          python -m pytest -p no:playwright --alluredir=allure-results
        continue-on-error: true

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@v1.7
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Upload Test Results Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-artifacts
          path: |
            reports/
            allure-results/
          retention-days: 7